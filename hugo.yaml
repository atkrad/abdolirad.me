baseURL: "https://abdolirad.me/"
locale: "en-us"
title: M. Abdolirad

enableRobotsTXT: true
defaultContentLanguage: en
defaultContentLanguageInSubdir: true

languages:
  en:
    baseURL: "https://abdolirad.me/"
    locale: en-US
    contentDir: content/en
    direction: ltr
    label: ":us:"
    menus:
      main:
        - name: Articles
          pageRef: /articles
          weight: 10
        - name: Archives
          pageRef: /archives
          weight: 20
    params:
      label:
        text: "The Other Branch"
    weight: 1
  fa:
    baseURL: "https://abdolirad.ir/"
    locale: fa-IR
    contentDir: content/fa
    direction: rtl
    label: ":iran:"
    menus:
      main:
        - name: مقالات
          pageRef: /articles
          weight: 10
        - name: آرشیو
          pageRef: /archives
          weight: 20
    title: محمد عبدلی‌راد
    params:
      label:
        text: "شاخهٔ دیگر"
      homeInfoParams:
        Title: "محمد عبدلی‌راد"
        Content: |
          ## مهندس نرم‌افزار و پلتفرم

          من نرم‌افزار و ابزارهایی برای توسعه‌دهندگان می‌سازم. در طراحی آن‌ها، سادگی، قابل‌اعتماد بودن و تجربهٔ توسعه‌دهنده برایم اهمیت زیادی دارد. اینجا دربارهٔ تصمیم‌های مهندسی، چالش‌های واقعی و چیزهایی که در این مسیر یاد می‌گیرم، می‌نویسم.
    weight: 2

module:
  imports:
    # Copied templates under layouts/ override PaperMod. See TODO.md before upgrading.
    - path: github.com/adityatelange/hugo-PaperMod

params:
  env: production
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  profileMode:
    enabled: false
  homeInfoParams:
    Title: "Mohammad Abdolirad"
    Content: |
      ## Software & Platform Engineer

      I build software and developer tools with a focus on simplicity, reliability, and developer experience. Here, I write about engineering decisions, real-world challenges, and lessons learned along the way.
  mainSections:
    - articles
  socialIcons:
    - name: "github"
      url: "https://github.com/atkrad"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/atkrad"
    - name: "reddit"
      url: "https://www.reddit.com/user/atkrad"
    - name: "email"
      url: "mailto:m.abdolirad@gmail.com"
